# On every push to main: updates the Supabase database with supabase/schema.sql,
# then builds the static site and publishes it on GitHub Pages.
# Needs two repository variables (Settings → Secrets and variables → Actions → Variables):
#   SUPABASE_URL       https://<project>.supabase.co
#   SUPABASE_ANON_KEY  the project's publishable (anon) key — public by design
# and, to update the database automatically, one repository secret (… → Secrets):
#   SUPABASE_DB_URL    the "Session pooler" connection string, with the database password
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The schema is idempotent and runs as one transaction: if anything fails,
      # the database is left as it was and the site is not published.
      - name: Apply supabase/schema.sql
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::warning::SUPABASE_DB_URL is not set: run supabase/schema.sql by hand in the SQL Editor."
            exit 0
          fi
          psql "$SUPABASE_DB_URL" --single-transaction -v ON_ERROR_STOP=1 -q -f supabase/schema.sql

  build:
    needs: database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          # <user>.github.io/<repo>/ needs the repo name as base path; a user/org site does not.
          NEXT_PUBLIC_BASE_PATH: ${{ endsWith(github.event.repository.name, '.github.io') && '' || format('/{0}', github.event.repository.name) }}
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
